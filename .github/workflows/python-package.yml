name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - name: Install package and test dependencies
        run: python -m pip install ".[testing]" "pyramid>=2"
      - name: Run tests
        if: matrix.python-version != '3.14'
        run: python -m pytest
      - name: Run tests with branch coverage
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install coverage
          python -m coverage run --branch --source=pyramid_route_7 -m pytest
          python -m coverage report --show-missing
          {
            echo '### Python 3.14 branch coverage'
            echo '~~~text'
            python -m coverage report --show-missing
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  python36:
    name: Python 3.6
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-python has no Python 3.6 build for this runner.
      - name: Run tests in the Python 3.6 image
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            python:3.6.15-slim-bullseye sh -ec '
              python -m pip install ".[testing]" "pyramid>=2"
              python -m pytest
            '
