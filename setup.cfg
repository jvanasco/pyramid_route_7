[metadata]
name = pyramid_route_7
version = attr: pyramid_route_7.__VERSION__
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/pyramid_route_7
description = micro-templating extensions to Pyramid routing
long_description = file: README.rst
keywords = web pyramid routing routes
license = MIT
license_file = LICENSE.txt
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
packages = find:
package_dir =
    = src
include_package_data = True
zip_safe = False
install_requires =
    pyramid

[options.packages.find]
where = src

[options.package_data]
pyramid_route_7 = py.typed

[options.extras_require]
testing =
    mypy
    pytest
    webtest

[easy_install]
zip_ok = false

[flake8]
application_import_names = pyramid_route_7
import_order_style = appnexus

exclude = .eggs, .tox, build

# E501: line too long
per-file-ignores =
	src/pyramid_route_7/__init__.py: E501
	tests/r7testapp/__init__.py: E501
    tests/test_app.py: E501, F841
    tests/test_config.py: E501

[tox:tox]
envlist =
    lint,
    mypy,
    py36,py37,py38,py39,py310,py311,py312,py313,py314,py315

[testenv]
extras =
    testing
commands =
    python --version
    pytest {posargs:}
